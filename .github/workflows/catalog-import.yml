name: USDA catalog import

# Pulls official USDA FoodData Central records with the repository's
# USDA_API_KEY secret and commits the normalized snapshot back to the branch.
# Runs when the importer changes on a work branch, or on demand.
on:
  push:
    branches-ignore: [main, dev]
    paths:
      - scripts/usda/**
      - .github/workflows/catalog-import.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Import from FoodData Central
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: python3 scripts/usda/import_starter.py
      - name: Verify snapshot
        run: python3 scripts/usda/import_starter.py --check
      - name: Commit snapshot if changed
        run: |
          git add data/catalog
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update USDA catalog snapshot" -m "Generated by .github/workflows/catalog-import.yml from FoodData Central (SR Legacy)."
          git push origin "HEAD:${GITHUB_REF_NAME}"
