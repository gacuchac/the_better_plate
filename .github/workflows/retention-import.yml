name: USDA retention import

# Downloads the USDA Table of Nutrient Retention Factors (Release 6) from USDA ARS
# and commits the normalized snapshot back to the branch. Cloud sessions can't reach
# USDA hosts, so this runs on GitHub Actions. Runs when the importer changes on a
# work branch, or on demand.
on:
  push:
    branches-ignore: [main, dev]
    paths:
      - scripts/usda/import_retention.py
      - .github/workflows/retention-import.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retention-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Import retention factors from USDA ARS
        run: python3 scripts/usda/import_retention.py
      - name: Verify snapshot
        run: python3 scripts/usda/import_retention.py --check
      - name: Commit snapshot if changed
        run: |
          git add data/catalog/retention-factors.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import USDA nutrient retention factors (Release 6)" -m "Generated by .github/workflows/retention-import.yml from USDA ARS."
          git push origin "HEAD:${GITHUB_REF_NAME}"
